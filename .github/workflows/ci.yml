name: CI and release image
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test frontend
        run: |
          bash tests/deploy-safety.sh
          docker build --target build -t poker-tests .
          docker run --rm -e CI=true poker-tests npm test -- --watchAll=false --runInBand
      - name: Build production image and verify HTTP routes
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t poker-release .
          bash scripts/check-image.sh poker-release
      - name: Publish checked image from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag poker-release "$image"
          docker push "$image"
          docker logout ghcr.io
          printf 'Release run: `%s`\n\nCommit: `%s`\n\nImage: `%s`\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$image" >> "$GITHUB_STEP_SUMMARY"
